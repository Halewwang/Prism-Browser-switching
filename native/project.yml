name: PrismNative
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "15.0"
packages:
  PrismCore:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targets:
  PrismNative:
    type: application
    platform: macOS
    sources: [PrismNative, UpdateInstallerShared]
    resources:
      - path: PrismNative/Resources/SupportedSources.json
    dependencies:
      - target: PrismUpdateInstaller
        embed: false
      - package: PrismCore
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prism.app
        PRODUCT_NAME: Prism
        PRODUCT_MODULE_NAME: PrismNative
        MACOSX_DEPLOYMENT_TARGET: 15.0
        SWIFT_VERSION: 6.0
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: 1.14.4
        CURRENT_PROJECT_VERSION: 5
        SPARKLE_PUBLIC_ED_KEY: ""
    info:
      path: PrismNative/Resources/Info.plist
      properties:
        CFBundleName: Prism
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.prism.app.http
            CFBundleURLSchemes: [http]
          - CFBundleURLName: com.prism.app.https
            CFBundleURLSchemes: [https]
        LSMinimumSystemVersion: "15.0"
        NSPrincipalClass: NSApplication
        SUFeedURL: https://github.com/Halewwang/Prism-Browser-switching/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SUAllowsAutomaticUpdates: false
        SUAutomaticallyUpdate: false
    postBuildScripts:
      - name: Embed update installer
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          cp "$BUILT_PRODUCTS_DIR/PrismUpdateInstaller" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/PrismUpdateInstaller"
          if [ "$CODE_SIGNING_ALLOWED" = "YES" ] && [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
            /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/PrismUpdateInstaller"
          fi
        inputFiles: ["$(BUILT_PRODUCTS_DIR)/PrismUpdateInstaller"]
        outputFiles: ["$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/PrismUpdateInstaller"]
    entitlements:
      path: PrismNative/Resources/PrismNative.entitlements
  PrismNativePublicTest:
    type: application
    platform: macOS
    sources: [PrismNative, UpdateInstallerShared]
    resources:
      - path: PrismNative/Resources/SupportedSources.json
    dependencies:
      - target: PrismUpdateInstaller
        embed: false
      - package: PrismCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prism.app
        PRODUCT_NAME: Prism
        PRODUCT_MODULE_NAME: PrismNative
        MACOSX_DEPLOYMENT_TARGET: 15.0
        SWIFT_VERSION: 6.0
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) PRISM_PUBLIC_TEST
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: 1.14.4
        CURRENT_PROJECT_VERSION: 5
        SPARKLE_PUBLIC_ED_KEY: ""
    info:
      path: PrismNative/Resources/Info.plist
      properties:
        CFBundleName: Prism
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.prism.app.http
            CFBundleURLSchemes: [http]
          - CFBundleURLName: com.prism.app.https
            CFBundleURLSchemes: [https]
        LSMinimumSystemVersion: "15.0"
        NSPrincipalClass: NSApplication
        SUFeedURL: https://github.com/Halewwang/Prism-Browser-switching/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SUAllowsAutomaticUpdates: false
        SUAutomaticallyUpdate: false
    postBuildScripts:
      - name: Embed update installer
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          cp "$BUILT_PRODUCTS_DIR/PrismUpdateInstaller" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/PrismUpdateInstaller"
          if [ "$CODE_SIGNING_ALLOWED" = "YES" ] && [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
            /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/PrismUpdateInstaller"
          fi
        inputFiles: ["$(BUILT_PRODUCTS_DIR)/PrismUpdateInstaller"]
        outputFiles: ["$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/PrismUpdateInstaller"]
    entitlements:
      path: PrismNative/Resources/PrismNative.entitlements
  PrismUpdateInstaller:
    type: tool
    platform: macOS
    sources: [PrismUpdateInstaller, UpdateInstallerShared, PrismNative/Updates/PrismUpdateTrust.swift]
    settings:
      base:
        PRODUCT_NAME: PrismUpdateInstaller
        MACOSX_DEPLOYMENT_TARGET: 15.0
        SWIFT_VERSION: 6.0
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
  PrismNativeTests:
    type: bundle.unit-test
    platform: macOS
    sources: [PrismNativeTests]
    dependencies:
      - target: PrismNative
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Prism.app/Contents/MacOS/Prism
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
  PrismNativeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [PrismNativeUITests]
    dependencies:
      - target: PrismNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PrismNative-Unit:
    build:
      targets:
        PrismNative: all
        PrismNativeTests: [test]
    test:
      targets: [PrismNativeTests]
  PrismNative-UI:
    build:
      targets:
        PrismNative: all
        PrismNativeUITests: [test]
    test:
      targets: [PrismNativeUITests]
  PrismNative-Release:
    build:
      targets:
        PrismNative: all
    archive:
      config: Release
  PrismNative-PublicTest:
    build:
      targets:
        PrismNativePublicTest: all
    archive:
      config: Release
